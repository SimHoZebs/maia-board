components:
  schemas:
    BatchLine:
      additionalProperties: false
      properties:
        initial_fen:
          type: string
        moves:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - initial_fen
        - moves
      type: object
    BatchProgress:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/BatchProgress.json
          format: uri
          readOnly: true
          type: string
        done:
          format: int64
          type: integer
        errors:
          additionalProperties:
            type: string
          type: object
        failed:
          format: int64
          type: integer
        finished:
          type: boolean
        job_id:
          type: string
        total:
          format: int64
          type: integer
      required:
        - job_id
        - total
        - done
        - failed
        - finished
      type: object
    BatchSubmitted:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/BatchSubmitted.json
          format: uri
          readOnly: true
          type: string
        cached:
          format: int64
          type: integer
        job_id:
          type: string
        pending:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - job_id
        - total
        - cached
        - pending
      type: object
    DeltaBaseline:
      additionalProperties: false
      properties:
        kind:
          type: string
        value:
          format: double
          type: number
      required:
        - value
        - kind
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    EvalCacheBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EvalCacheBody.json
          format: uri
          readOnly: true
          type: string
        created_at:
          type: string
        engine:
          type: string
        key:
          type: string
        key_hash:
          type: string
        value: {}
      required:
        - key_hash
        - engine
        - key
        - value
        - created_at
      type: object
    EvalStatsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EvalStatsBody.json
          format: uri
          readOnly: true
          type: string
        bytes:
          format: int64
          type: integer
        count:
          format: int64
          type: integer
        max_rows:
          format: int64
          type: integer
      required:
        - count
        - bytes
        - max_rows
      type: object
    EvaluationLine:
      additionalProperties: false
      properties:
        depth:
          format: int64
          type: integer
        move:
          type: string
        pv:
          items:
            type: string
          type:
            - array
            - "null"
        score:
          $ref: "#/components/schemas/EvaluationScore"
      required:
        - move
        - score
        - depth
      type: object
    EvaluationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EvaluationRequest.json
          format: uri
          readOnly: true
          type: string
        cache_hash:
          type: string
        cache_key:
          type: string
        fen:
          type: string
        initial_fen:
          type: string
        moves:
          items:
            type: string
          type:
            - array
            - "null"
        pos_hash:
          type: string
        settings:
          $ref: "#/components/schemas/StockfishSettings"
      required:
        - fen
        - moves
      type: object
    EvaluationResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/EvaluationResponse.json
          format: uri
          readOnly: true
          type: string
        actual_settings:
          $ref: "#/components/schemas/StockfishSettings"
        best_move:
          type:
            - string
            - "null"
        depth:
          format: int64
          type: integer
        engine:
          type: string
        lines:
          items:
            $ref: "#/components/schemas/EvaluationLine"
          type:
            - array
            - "null"
        score:
          $ref: "#/components/schemas/EvaluationScore"
        search_policy:
          type: string
        terminal:
          type:
            - string
            - "null"
      required:
        - engine
        - search_policy
        - depth
        - terminal
        - best_move
        - score
        - lines
      type: object
    EvaluationScore:
      additionalProperties: false
      properties:
        type:
          type: string
        value:
          format: int64
          type: integer
        winning_side:
          type: string
      required:
        - type
        - value
      type: object
    GamePayload:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/GamePayload.json
          format: uri
          readOnly: true
          type: string
        created_at:
          type: string
        current:
          type: boolean
        elo_maia:
          format: int64
          type:
            - integer
            - "null"
        elo_user:
          format: int64
          type:
            - integer
            - "null"
        id:
          type: string
        model:
          type: string
        moves:
          items:
            type: string
          type:
            - array
            - "null"
        result:
          type: string
        temperature:
          format: double
          type: number
        user_color:
          type: string
      required:
        - user_color
        - elo_maia
        - elo_user
        - model
        - moves
      type: object
    GameRow:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/GameRow.json
          format: uri
          readOnly: true
          type: string
        created_at:
          type: string
        elo_maia:
          format: int64
          type: integer
        elo_user:
          format: int64
          type: integer
        id:
          type: string
        model:
          type: string
        moves:
          items:
            type: string
          type:
            - array
            - "null"
        result:
          type: string
        temperature:
          format: double
          type: number
        updated_at:
          type: string
        user_color:
          type: string
      required:
        - temperature
        - id
        - created_at
        - updated_at
        - user_color
        - elo_maia
        - elo_user
        - model
        - moves
      type: object
    GamesPage:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/GamesPage.json
          format: uri
          readOnly: true
          type: string
        current_game:
          $ref: "#/components/schemas/GameRow"
        current_id:
          type:
            - string
            - "null"
        games:
          items:
            $ref: "#/components/schemas/GameRow"
          type:
            - array
            - "null"
        next_offset:
          format: int64
          type:
            - integer
            - "null"
        total:
          format: int64
          type: integer
      required:
        - games
        - current_id
        - total
        - next_offset
      type: object
    HealthBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HealthBody.json
          format: uri
          readOnly: true
          type: string
        models:
          additionalProperties:
            $ref: "#/components/schemas/WorkerStatus"
          type: object
        status:
          type: string
      required:
        - status
        - models
      type: object
    LookupBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/LookupBody.json
          format: uri
          readOnly: true
          type: string
        line:
          $ref: "#/components/schemas/BatchLine"
        requests:
          items:
            $ref: "#/components/schemas/LookupRequest"
          type:
            - array
            - "null"
      required:
        - line
        - requests
      type: object
    LookupRequest:
      additionalProperties: false
      properties:
        elo_maia:
          format: int64
          type: integer
        elo_user:
          format: int64
          type: integer
        engine:
          type: string
        fen:
          type: string
        model:
          type: string
        ply:
          format: int64
          type: integer
        pos_hash:
          type: string
        settings:
          $ref: "#/components/schemas/StockfishSettings"
        value_elo_maia:
          format: int64
          type: integer
        value_elo_user:
          format: int64
          type: integer
      required:
        - engine
        - fen
        - ply
      type: object
    LookupResult:
      additionalProperties: false
      properties:
        actual_settings:
          $ref: "#/components/schemas/StockfishSettings"
        index:
          format: int64
          type: integer
        value: {}
      required:
        - index
        - value
      type: object
    LookupResults:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/LookupResults.json
          format: uri
          readOnly: true
          type: string
        results:
          items:
            $ref: "#/components/schemas/LookupResult"
          type:
            - array
            - "null"
      required:
        - results
      type: object
    Match:
      additionalProperties: false
      properties:
        eco:
          type: string
        name:
          type: string
        ply:
          format: int64
          type: integer
      required:
        - ply
        - eco
        - name
      type: object
    MoveRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/MoveRequest.json
          format: uri
          readOnly: true
          type: string
        cache_hash:
          type: string
        cache_key:
          type: string
        elo_maia:
          format: int64
          type:
            - integer
            - "null"
        elo_user:
          format: int64
          type:
            - integer
            - "null"
        fen:
          type: string
        initial_fen:
          type: string
        maia_color:
          type: string
        model:
          type: string
        moves:
          items:
            type: string
          type:
            - array
            - "null"
        temperature:
          format: double
          type: number
        value_elo_maia:
          format: int64
          type: integer
        value_elo_user:
          format: int64
          type: integer
      required:
        - fen
        - moves
        - elo_maia
        - elo_user
        - model
        - maia_color
      type: object
    MoveResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/MoveResponse.json
          format: uri
          readOnly: true
          type: string
        degraded:
          type: boolean
        delta_baseline:
          $ref: "#/components/schemas/DeltaBaseline"
        model_used:
          type: string
        move:
          type: string
        top_moves:
          items:
            $ref: "#/components/schemas/TopMove"
          type:
            - array
            - "null"
        wdl:
          items:
            format: double
            type: number
          maxItems: 3
          minItems: 3
          type:
            - array
            - "null"
      required:
        - move
        - top_moves
        - wdl
        - model_used
        - degraded
      type: object
    Request:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Request.json
          format: uri
          readOnly: true
          type: string
        initial_fen:
          type: string
        moves:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - moves
      type: object
    Response:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Response.json
          format: uri
          readOnly: true
          type: string
        book_flags:
          items:
            type: boolean
          type:
            - array
            - "null"
        degraded:
          type: boolean
        matches:
          items:
            $ref: "#/components/schemas/Match"
          type:
            - array
            - "null"
      required:
        - matches
        - book_flags
      type: object
    StockfishSettings:
      additionalProperties: false
      properties:
        depth:
          format: int64
          type: integer
        lines:
          format: int64
          type: integer
        time_ms:
          format: int64
          type: integer
      required:
        - time_ms
        - lines
        - depth
      type: object
    SubmitBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SubmitBody.json
          format: uri
          readOnly: true
          type: string
        line:
          $ref: "#/components/schemas/BatchLine"
        requests:
          items:
            $ref: "#/components/schemas/LookupRequest"
          type:
            - array
            - "null"
      required:
        - line
        - requests
      type: object
    TopMove:
      additionalProperties: false
      properties:
        delta:
          format: double
          type: number
        move:
          type: string
        prob:
          format: double
          type: number
        wdl:
          items:
            format: double
            type: number
          maxItems: 3
          minItems: 3
          type:
            - array
            - "null"
      required:
        - move
        - prob
        - wdl
      type: object
    WorkerStatus:
      additionalProperties: false
      properties:
        last_error:
          type: string
        state:
          type: string
      required:
        - state
      type: object
info:
  title: Maia Board
  version: 1.0.0
openapi: 3.1.0
paths:
  /evaluate:
    post:
      operationId: evaluate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResponse"
          description: OK
          headers:
            X-Eval-Cache:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Stockfish search (Focus lane)
  /evaluations/lookup:
    post:
      operationId: evaluations-lookup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResults"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Bulk cache read (read-only, never admits or infers)
  /evaluations/stats:
    get:
      operationId: evaluations-stats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalStatsBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Evaluation cache stats
  /evaluations/{hash}:
    get:
      operationId: evaluations-get
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalCacheBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Fetch one cached evaluation by key hash
  /games:
    get:
      operationId: games-list
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            type: string
        - explode: false
          in: query
          name: offset
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesPage"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: List saved games with paging
    post:
      operationId: games-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GamePayload"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRow"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Save a game (upsert by id)
  /games/{id}:
    delete:
      operationId: games-delete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Delete one saved game
    get:
      operationId: games-get
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRow"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Fetch one saved game
  /healthz:
    get:
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Engine pool health
  /move:
    post:
      operationId: move
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveResponse"
          description: OK
          headers:
            X-Eval-Cache:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
