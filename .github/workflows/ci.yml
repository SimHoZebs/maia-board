name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    name: Go and mocked Python workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight worker test dependencies
        run: python -m pip install python-chess==1.999 chess==1.11.2
      - name: Go unit tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Mocked Maia and Stockfish worker tests
        run: python -m unittest discover -v
  frontend:
    name: Frontend unit, types, build and browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Openings table freshness
        run: node scripts/build-openings-table.mjs --check
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build:bundle
        env:
          MAIA_BUILD_DIR: dist-browser
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser:run -- --reporter=line,html --output=test-results/ci
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ci
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            frontend/test-results/ci/
            frontend/playwright-report/ci/
          if-no-files-found: ignore
  stockfish:
    name: Packaged Stockfish integration
    # Packaging coverage mapping (replaces the deleted stockfish-test
    # container): docker build of the stockfish-build stage proves packaging;
    # host worker/settings/HTTP tests below prove behavior against the
    # extracted pinned binary. Demoting real-engine tests to nightly is
    # deferred — they still run per-PR at current cost.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned Stockfish 19
        run: docker build --target stockfish-build -f backend/Dockerfile -t maia-board-stockfish-check:engine .
      - name: Extract engine binary
        run: |
          container=$(docker create maia-board-stockfish-check:engine)
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/stockfish/src/stockfish" "$RUNNER_TEMP/stockfish"
      - name: Install lightweight worker test dependencies
        run: python -m pip install python-chess==1.999 chess==1.11.2
      - name: Real Stockfish worker and search settings tests
        working-directory: backend
        run: STOCKFISH_BINARY="$RUNNER_TEMP/stockfish" python -m unittest -v test_stockfish_worker test_engine_settings
      - name: Real Stockfish HTTP and cancellation test
        working-directory: backend
        run: STOCKFISH_BINARY="$RUNNER_TEMP/stockfish" STOCKFISH_WORKER="$PWD/stockfish_worker.py" CGO_ENABLED=0 go test -v -count=1 -run '^TestRealStockfishHTTPAndCancellation$'
