[[stack]]
name = "maia-board"
description = "LAN-only Maia3 chess board on debian-server"

[stack.config]
server = "debian-server"
linked_repo = "maia-board"
branch = "master"
run_directory = "deployment"
project_name = "maia-board"
file_paths = ["compose.yaml"]

# The stack stays declaration-only until the image and linked repository are registered.
# The compose file intentionally uses an image-only service, so run_build is omitted.
